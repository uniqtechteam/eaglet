[package]
name = "eaglet"
description = "The NestJS structure for Rust web apps: modules, providers, controllers and guards on top of Axum."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
eaglet-macros.workspace = true
axum.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
validator = { workspace = true, optional = true }

[features]
default = ["validate"]
## `Valid<Json<T>>` and `Valid<Query<T>>`, checked with the `validator` crate.
validate = ["dep:validator"]

[dev-dependencies]
trybuild.workspace = true
validator = { workspace = true, features = ["derive"] }
tower.workspace = true
http-body-util.workspace = true

[lints]
workspace = true
