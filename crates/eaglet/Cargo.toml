[package]
name = "eaglet"
description = "A structure for Rust web apps on Axum: modules, dependency injection, controllers, guards and validation, checked at startup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
eaglet-macros.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["signal", "time"] }
hyper = { workspace = true }
hyper-util = { workspace = true }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
validator = { workspace = true, optional = true }
tower.workspace = true
http-body-util = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[features]
default = ["validate", "swagger"]
## `App::openapi()`: an OpenAPI 3.1 document built from the controllers.
openapi = ["dep:utoipa"]
## `App::swagger("/docs")`: Swagger UI and `/docs/openapi.json`.
swagger = ["openapi"]
## `Valid<Json<T>>` and `Valid<Query<T>>`, checked with the `validator` crate.
validate = ["dep:validator"]
## `eaglet::testing`: `TestApp`, provider overrides and an in-memory client. Turn it on in
## `[dev-dependencies]`.
testing = ["dep:http-body-util"]

[dev-dependencies]
eaglet = { path = ".", features = ["testing"] }
trybuild.workspace = true
tokio = { workspace = true, features = ["io-util", "sync"] }
validator = { workspace = true, features = ["derive"] }
tower.workspace = true
http-body-util.workspace = true
utoipa.workspace = true
jsonschema.workspace = true
tower-http.workspace = true

[lints]
workspace = true
