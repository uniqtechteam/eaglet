<rect class="axum" x="190" y="290" width="135.4" height="16" rx="4"><title>plain Axum, GET /users/:id: 604 ns</title></rect><text x="331.4" y="303" class="v">604 ns</text>
<rect class="eaglet" x="190" y="308" width="177.6" height="16" rx="4"><title>eaglet, GET /users/:id: 792 ns</title></rect><text x="373.6" y="321" class="v">792 ns</text>
