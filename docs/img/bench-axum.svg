<rect class="axum" x="190" y="290" width="133.1" height="16" rx="4"><title>plain Axum, GET /users/:id: 601 ns</title></rect><text x="329.1" y="303" class="v">601 ns</text>
<rect class="eaglet" x="190" y="308" width="171.2" height="16" rx="4"><title>eaglet, GET /users/:id: 773 ns</title></rect><text x="367.2" y="321" class="v">773 ns</text>
