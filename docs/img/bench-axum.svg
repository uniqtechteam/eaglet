<svg xmlns="http://www.w3.org/2000/svg" width="680" height="492" viewBox="0 0 680 492" font-family="system-ui, sans-serif" font-size="13" role="img" aria-label="Requests per second and cost per request, plain Axum against eaglet">
<style>text{fill:#52514e}.v{fill:#0b0b0b}.axum{fill:#2a78d6}.eaglet{fill:#eb6834}@media (prefers-color-scheme: dark){text{fill:#c3c2b7}.v{fill:#f0efec}.axum{fill:#3987e5}.eaglet{fill:#d95926}}</style>
