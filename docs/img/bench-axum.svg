<rect class="eaglet" x="190" y="218" width="317.2" height="16" rx="4"><title>eaglet, GET /me (guarded): 399,281</title></rect><text x="513.2" y="231" class="v">399,281</text>
<text x="0" y="276" class="v" font-weight="600">Framework cost per request, in memory (lower is better)</text>
<text x="0" y="312" class="v">GET /users/:id</text>
<rect class="axum" x="190" y="290" width="112.9" height="16" rx="4"><title>plain Axum, GET /users/:id: 634 ns</title></rect><text x="308.9" y="303" class="v">634 ns</text>
<rect class="eaglet" x="190" y="308" width="202.1" height="16" rx="4"><title>eaglet, GET /users/:id: 1,135 ns</title></rect><text x="398.1" y="321" class="v">1,135 ns</text>
<text x="0" y="366" class="v">POST /users (validated)</text>
