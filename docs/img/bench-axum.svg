<rect class="eaglet" x="190" y="164" width="273.4" height="16" rx="4"><title>eaglet, POST /users (validated): 344,209</title></rect><text x="469.4" y="177" class="v">344,209</text>
<text x="0" y="222" class="v">GET /me (guarded)</text>
