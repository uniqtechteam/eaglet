[workspace]
resolver = "3"
members = ["crates/eaglet", "crates/eaglet-macros", "crates/eaglet-cli", "examples/shop", "bench"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uniqtechteam/eaglet"
authors = ["UniqTech <https://uniqtech.dev>"]
readme = "README.md"
keywords = ["web", "framework", "axum", "http", "dependency-injection"]
categories = ["web-programming::http-server"]

[workspace.dependencies]
eaglet = { path = "crates/eaglet", version = "0.1.3" }
eaglet-macros = { path = "crates/eaglet-macros", version = "0.1.3" }
clap = { version = "4.5", features = ["derive"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
hyper = { version = "1.4", features = ["http1", "server"] }
hyper-util = { version = "0.1.10", features = ["tokio", "service"] }
tower-http = { version = "0.7", features = ["timeout", "cors", "set-header"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
trybuild = "1"
http-body-util = "0.1"
validator = "0.21"
utoipa = "5.5"
jsonschema = { version = "0.61", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
