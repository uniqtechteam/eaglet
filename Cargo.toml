[workspace]
resolver = "3"
members = ["crates/eaglet", "crates/eaglet-macros", "crates/eaglet-cli"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uniqtechteam/eaglet"
homepage = "https://github.com/uniqtechteam/eaglet"
authors = ["UniqTech <https://uniqtech.dev>"]
keywords = ["web", "framework", "axum", "nestjs", "dependency-injection"]
categories = ["web-programming::http-server"]

[workspace.dependencies]
eaglet = { path = "crates/eaglet", version = "0.1.0-dev" }
eaglet-macros = { path = "crates/eaglet-macros", version = "0.1.0-dev" }
clap = { version = "4.5", features = ["derive"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
