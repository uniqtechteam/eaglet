[package]
name = "shop"
description = "An eaglet example: sign-up, JWT sign-in and products owned by users, on SQLite."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
eaglet.workspace = true
argon2 = "0.6"
async-trait = "0.1"
jsonwebtoken = { version = "9", default-features = false }
password-hash = { version = "0.5", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa.workspace = true
validator = { workspace = true, features = ["derive"] }

[dev-dependencies]
eaglet = { workspace = true, features = ["testing"] }

[lints]
workspace = true
