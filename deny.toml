# cargo-deny: licences, advisories, duplicate and unknown sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error2 is unmaintained (no fix exists). It only runs at compile time inside
    # validator's derive macro; revisit when validator drops it.
    { id = "RUSTSEC-2026-0173", reason = "compile-time only, via validator_derive; no maintained release yet" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
