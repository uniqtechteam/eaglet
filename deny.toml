# cargo-deny: licences, advisories, duplicate and unknown sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error2 is unmaintained (no fix exists). It only runs at compile time inside
    # validator's derive macro; revisit when validator drops it.
    { id = "RUSTSEC-2026-0173", reason = "compile-time only, via validator_derive; no maintained release yet" },
    # SQLite < 3.54 can return stale page-cache bytes when it opens an attacker-made database plus a
    # mismatched -wal file. Only examples/shop uses SQLite, on its own file. The newest sqlx (0.9.0)
    # still caps libsqlite3-sys below the fixed 0.39; drop this when sqlx allows it.
    { id = "RUSTSEC-2026-0459", reason = "local only, needs crafted db + wal files; sqlx has no release with libsqlite3-sys >= 0.39 yet" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
